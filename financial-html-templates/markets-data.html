<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markets Data — Meridian Global Finance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700;8..60,900&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/meridian.css" />
</head>
<body>
  <div data-chrome="header"></div>

  <main id="main" class="container-x mx-auto px-3 py-4">
    <nav aria-label="Breadcrumb" class="mb-3 text-uppercase tracking-wide text-faint" style="font-size:11px">
      <a href="index.html" class="text-faint">Home</a><span class="mx-2">/</span><span class="text-ink">Markets Data</span>
    </nav>

    <header class="pb-3" style="border-bottom:2px solid var(--ink)">
      <h1 class="font-serif fw-black" style="font-size:38px;line-height:1;letter-spacing:-.02em">Markets Data</h1>
      <p class="text-soft mt-2" style="font-size:15px">Cross-asset benchmarks and sector performance. Figures are indicative and delayed.</p>
    </header>

    <div class="row g-4 mt-1">
      <div class="col-12 col-lg-8">
        <section class="card-box">
          <div class="hd dark">Global Benchmarks</div>
          <table class="table mb-0" style="font-size:13px">
            <thead><tr class="text-faint text-uppercase tracking-wide" style="font-size:11px">
              <th class="ps-3">Instrument</th><th class="text-end">Last</th><th class="text-end pe-3">Change</th>
            </tr></thead>
            <tbody id="tbl-markets"></tbody>
          </table>
        </section>

        <div class="my-4" id="md-ad"></div>

        <section class="card-box">
          <div class="hd dark">S&P 500 Sectors</div>
          <table class="table mb-0" style="font-size:13px"><tbody id="tbl-sectors"></tbody></table>
        </section>
      </div>

      <aside class="col-12 col-lg-4">
        <div class="d-flex flex-column gap-4" id="md-rail"></div>
      </aside>
    </div>
  </main>

  <div data-chrome="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/chrome.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const { MARKETS, SECTORS } = window.MARKET_DATA;
      document.getElementById("tbl-markets").innerHTML = MARKETS.map(([n, v, c, up]) =>
        `<tr class="border-bottom rule"><td class="ps-3 fw-semibold text-ink">${n}</td>
         <td class="text-end tabular">${v}</td>
         <td class="text-end pe-3 fw-semibold tabular ${up ? "text-up" : "text-down"}">${up ? "▲" : "▼"} ${c}</td></tr>`).join("");
      document.getElementById("tbl-sectors").innerHTML = SECTORS.map(([n, c, up]) =>
        `<tr class="border-bottom rule"><td class="ps-3 fw-semibold text-ink">${n}</td>
         <td class="text-end pe-3 fw-semibold tabular ${up ? "text-up" : "text-down"}">${c}</td></tr>`).join("");
      document.getElementById("md-ad").innerHTML = window.ad(728, 90);
      document.getElementById("md-rail").innerHTML =
        `<div class="ad-sticky">${window.ad(300, 250)}</div>` + window.ad(300, 600, true);
    });
  </script>
</body>
</html>
