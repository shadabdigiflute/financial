<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article — Meridian Global Finance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700;8..60,900&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/meridian.css" />
</head>
<body>
  <div data-chrome="header"></div>

  <main id="main" class="container-x mx-auto px-3 py-4">
    <nav aria-label="Breadcrumb" class="mb-3 text-uppercase tracking-wide text-faint" style="font-size:11px">
      <a href="index.html" class="text-faint">Home</a>
      <span class="mx-2">/</span>
      <a href="#" id="crumb-cat" class="text-faint"></a>
    </nav>

    <div class="row g-4">
      <article class="col-12 col-lg-8">
        <header class="border-bottom rule-strong pb-4">
          <div class="d-flex flex-wrap align-items-center gap-2" id="art-meta"></div>
          <h1 class="font-serif fw-black mt-2" style="font-size:38px;line-height:1.08;letter-spacing:-.02em" id="art-title"></h1>
          <p class="font-serif text-soft mt-3" style="font-size:19px;line-height:1.45;max-width:720px" id="art-standfirst"></p>
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 border-top rule pt-3 mt-3">
            <div class="text-uppercase tracking-wide text-faint" style="font-size:12px">
              <span class="fw-semibold text-ink" id="art-byline"></span>
              <span class="mx-2">·</span><span id="art-time"></span>
            </div>
            <div class="d-flex align-items-center gap-3 text-accent fw-semibold text-uppercase tracking-wide" style="font-size:12px">
              <button type="button" class="btn btn-link p-0 text-accent text-decoration-none">Save</button>
              <button type="button" class="btn btn-link p-0 text-accent text-decoration-none">Gift</button>
              <button type="button" class="btn btn-link p-0 text-accent text-decoration-none">Share</button>
            </div>
          </div>
        </header>

        <div class="article-body mt-4" id="art-body"></div>

        <div class="my-4 article-body" id="art-ad-end"></div>

        <section class="border-top rule-strong pt-4">
          <div id="rel-head"></div>
          <div class="row" id="rel-list"></div>
        </section>
      </article>

      <aside class="col-12 col-lg-4">
        <div class="d-flex flex-column gap-4" id="art-rail"></div>
      </aside>
    </div>
  </main>

  <div data-chrome="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/chrome.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const D = window.DATA;
      const slug = new URLSearchParams(location.search).get("a") || "";
      const a = D.getArticle(slug);

      document.title = a.title + " — Meridian";
      const catCrumb = document.getElementById("crumb-cat");
      catCrumb.textContent = a.kicker;
      catCrumb.href = "category.html?s=" + D.slugify(a.kicker);

      document.getElementById("art-meta").innerHTML =
        `<span class="kicker">${a.kicker}</span>` +
        (a.badge ? `<span style="color:var(--rule-strong)">·</span>${window.badge(a.badge)}` : "");
      document.getElementById("art-title").textContent = a.title;
      document.getElementById("art-standfirst").textContent = a.standfirst;
      document.getElementById("art-byline").textContent = a.byline;
      document.getElementById("art-time").textContent = "Published " + a.time;

      // Body with in-article ad after para 2 and a pull-quote after para 4
      document.getElementById("art-body").innerHTML = a.body.map((p, i) => {
        let html = `<p class="${i === 0 ? "dropcap" : ""}">${p}</p>`;
        if (i === 1) html += `<div class="my-4 py-4 border-top border-bottom rule">${window.ad(300, 250)}</div>`;
        if (i === 3) html += `<blockquote class="pullquote">“The signal here is clearer than the market had assumed.”</blockquote>`;
        return html;
      }).join("");

      document.getElementById("art-ad-end").innerHTML = window.ad(728, 90);

      document.getElementById("rel-head").innerHTML = window.sectionHead("Related Stories");
      document.getElementById("rel-list").innerHTML =
        a.related.map((it) => `<div class="col-12 col-sm-6">${window.headline(it)}</div>`).join("");

      // Compact rail: sticky tall ad first for viewability
      document.getElementById("art-rail").innerHTML =
        window.ad(300, 600, true) +
        `<section>${window.sectionHead("Most Read")}<ol class="list-unstyled most-read m-0">` +
        ["Live markets: Stocks, bonds and the dollar react to the Fed minutes",
         "Explained: What a September rate cut means for mortgages and savers",
         "The 10 charts that define the second-half outlook",
         "Big Read: Inside the $2tn private-credit machine",
         "Lex: Why the chip cycle isn't over yet"]
          .map((t, i) => `<li><span class="rank">${i + 1}</span><a href="article.html?a=${D.slugify(t)}">${t}</a></li>`).join("") +
        `</ol></section>`;
    });
  </script>
</body>
</html>
