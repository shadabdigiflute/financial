<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search — Meridian Global Finance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700;8..60,900&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/meridian.css" />
</head>
<body>
  <div data-chrome="header"></div>

  <main id="main" class="container-x mx-auto px-3 py-4">
    <header class="pb-3" style="border-bottom:2px solid var(--ink)">
      <p class="text-accent fw-bold text-uppercase tracking-wider" style="font-size:11px">Search</p>
      <form class="d-flex align-items-center gap-2 border-bottom rule-ink pb-1 mt-2" method="get" action="search.html">
        <input name="q" id="q" type="search" class="form-control border-0 bg-transparent shadow-none font-serif fw-bold p-0"
               style="font-size:24px" placeholder="Search markets, companies and topics…" />
        <button class="btn text-white bg-accent rounded-0 fw-semibold text-uppercase tracking-wide flex-shrink-0" style="font-size:13px">Search</button>
      </form>
    </header>

    <div class="row g-4 mt-1">
      <div class="col-12 col-lg-8">
        <p class="text-faint text-uppercase tracking-wide mb-3" style="font-size:13px" id="count"></p>
        <div class="row" id="results"></div>
      </div>
      <div class="col-12 col-lg-4" id="rail"></div>
    </div>
  </main>

  <div data-chrome="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/chrome.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const D = window.DATA;
      const q = (new URLSearchParams(location.search).get("q") || "").trim();
      document.getElementById("q").value = q;
      const query = q.toLowerCase();
      const results = query
        ? D.CORPUS.filter((it) => it.title.toLowerCase().includes(query) || (it.kicker || "").toLowerCase().includes(query))
        : [];

      const count = document.getElementById("count");
      count.textContent = q ? `${results.length} result${results.length === 1 ? "" : "s"} for “${q}”` : "";
      if (!q) count.outerHTML = `<p class="text-soft mb-3" style="font-size:15px">Enter a term above to search Meridian's coverage.</p>`;

      const list = document.getElementById("results");
      if (q && results.length === 0) {
        list.innerHTML = `<div class="col-12"><div class="text-center p-5 bg-card border border-dashed rule-strong">
          <p class="font-serif fw-bold mb-1" style="font-size:20px">No matching stories</p>
          <p class="text-soft" style="font-size:14px">Try a broader term, or browse a section.</p>
          <a href="index.html" class="fw-semibold text-accent mt-2 d-inline-block">← Back to the front page</a></div></div>`;
      } else {
        list.innerHTML = results.map((it, i) => {
          const ad = i === 5 ? `<div class="my-3 d-none d-sm-block">${window.ad(300, 250)}</div>` : "";
          return `<div class="col-12 col-sm-6">${window.headline(it)}${ad}</div>`;
        }).join("");
      }

      document.getElementById("rail").innerHTML = window.sidebar(true);
    });
  </script>
</body>
</html>
