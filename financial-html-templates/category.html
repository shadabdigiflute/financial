<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Section — Meridian Global Finance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700;8..60,900&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/meridian.css" />
</head>
<body>
  <div data-chrome="header"></div>

  <main id="main" class="container-x mx-auto px-3 py-4" id="cat-root">
    <nav aria-label="Breadcrumb" class="mb-3 text-uppercase tracking-wide text-faint" style="font-size:11px">
      <a href="index.html" class="text-faint">Home</a>
      <span class="mx-2">/</span>
      <span class="text-ink" id="crumb"></span>
    </nav>

    <header class="pb-3" style="border-bottom:2px solid var(--ink)">
      <h1 class="font-serif fw-black" style="font-size:38px;line-height:1;letter-spacing:-.02em" id="cat-name"></h1>
      <p class="text-soft mt-2" style="font-size:15px;line-height:1.5;max-width:640px" id="cat-standfirst"></p>
    </header>

    <div class="row g-4 mt-1">
      <div class="col-12 col-lg-8">
        <article class="border-bottom rule-strong pb-4" id="cat-lead"></article>
        <div class="my-4" id="cat-ad1"></div>
        <div class="row" id="cat-list"></div>
        <div class="mt-4" id="cat-ad2"></div>
      </div>
      <div class="col-12 col-lg-4" id="rail"></div>
    </div>
  </main>

  <div data-chrome="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/chrome.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const D = window.DATA;
      const slug = new URLSearchParams(location.search).get("s") || "world-markets";
      const cat = D.getCategory(slug);
      const root = document.getElementById("cat-root");

      if (!cat) {
        root.innerHTML = `<div class="text-center py-5">
          <p class="text-accent2 fw-bold text-uppercase tracking-wider" style="font-size:11px">Section</p>
          <h1 class="font-serif fw-black mt-2" style="font-size:30px">This section is being built</h1>
          <a href="index.html" class="fw-semibold text-accent mt-3 d-inline-block">← Back to the front page</a></div>`;
        return;
      }

      document.title = cat.name + " — Meridian Global Finance";
      document.getElementById("crumb").textContent = cat.name;
      document.getElementById("cat-name").textContent = cat.name;
      document.getElementById("cat-standfirst").textContent = cat.standfirst;

      const lead = cat.lead;
      const meta = (lead.kicker || lead.badge)
        ? `<span class="d-inline-flex flex-wrap align-items-center gap-2">${lead.kicker ? `<span class="kicker">${lead.kicker}</span>` : ""}${lead.kicker && lead.badge ? `<span style="color:var(--rule-strong)">·</span>` : ""}${window.badge(lead.badge)}</span>`
        : "";
      document.getElementById("cat-lead").innerHTML = `<a href="article.html?a=${D.slugify(lead.title)}" class="d-block">
        ${meta}
        <h2 class="font-serif fw-black mt-1" style="font-size:28px;line-height:1.12;letter-spacing:-.01em">${lead.title}</h2>
        <p class="text-soft mt-2" style="font-size:15px;line-height:1.5">The desk's lead story, with reporting and analysis on what it means for markets and policy.</p>
        <span class="time d-block mt-2">${lead.time}</span></a>`;

      document.getElementById("cat-ad1").innerHTML = window.ad(728, 90);
      document.getElementById("cat-ad2").innerHTML = window.ad(728, 90);

      document.getElementById("cat-list").innerHTML = cat.items.map((it, i) => {
        const ad = i === 5 ? `<div class="my-3 d-none d-sm-block">${window.ad(300, 250)}</div>` : "";
        return `<div class="col-12 col-sm-6">${window.headline(it)}${ad}</div>`;
      }).join("");

      document.getElementById("rail").innerHTML = window.sidebar();
    });
  </script>
</body>
</html>
